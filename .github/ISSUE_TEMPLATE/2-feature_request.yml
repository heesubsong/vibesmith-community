name: 💡 Feature Request
description: Suggest a new feature for VibeSmith
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem?
      placeholder: I'm frustrated when...
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like to see...
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
      placeholder: I also considered...
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking my workflow)
        - High (would significantly improve my workflow)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true
  
  - type: dropdown
    id: plan
    attributes:
      label: Plan
      description: Which plan are you using?
      options:
        - Free
        - Pro
  
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your specific use case
      placeholder: |
        I work with...
        I need this because...
    validations:
      required: true
  
  - type: textarea
    id: mockup
    attributes:
      label: Mockup / Example
      description: If you have a mockup or example, please share it here
      placeholder: Drag and drop images here
  
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context or screenshots
  
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing feature requests to avoid duplicates
          required: true
        - label: I would be willing to help test this feature
          required: false
